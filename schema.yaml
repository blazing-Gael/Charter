version: "1"

meta:
  name: dcms-docs
  description: "A Git-free documentation CMS built on DCMS: write in the browser, export to a static site."

auth:
  roles:
    admin:  { label: Administrator }   # manages sites, deletes, triggers export
    editor: { label: Editor }          # writes and publishes pages

collections:
  # A documentation space. One instance can host several (multi-site routing is a
  # later step). `visibility` decides how it's served: `public` exports to static
  # files; `private` is served live behind auth.
  sites:
    access: { read: public, create: [admin], update: [admin], delete: [admin] }
    fields:
      name:       { type: string, required: true }
      slug:       { type: string, unique: true }
      visibility: { type: enum, values: [public, private], default: public }
      theme:      { type: string, default: "classic" }
      home_intro: { type: text }   # markdown shown on the site homepage
      # How the page feedback widget treats email: none (don't ask), optional (ask,
      # not required), required (must supply a valid address). `verified` (email a
      # code to confirm) is a later step.
      feedback_email: { type: enum, values: [none, optional, required], default: optional }

  # The whole documentation tree — one self-referential collection, not pages-inside-
  # sections. Every sidebar entry is a node; `parent` builds the tree and `order` sorts
  # siblings. The node's shape decides how it renders (see the editor/theme):
  #   kind: label            → a static section header (not clickable, not collapsible)
  #   kind: page, has body, no children  → a plain link
  #   kind: page, no body, has children  → a dropdown (collapsible, no page of its own)
  #   kind: page, has body + children    → a link that is ALSO a dropdown (split click)
  # `slug` is only needed for nodes that are real pages (routed at /p/<slug>); labels
  # and pure dropdowns can omit it.
  pages:
    publishing: true
    revisions:  true
    access:
      read:   public
      create: [admin, editor]
      update: [admin, editor]
      delete: [admin]
    fields:
      title:  { type: string, required: true }
      slug:   { type: string, unique: true }
      kind:   { type: enum, values: [page, label], default: page }
      body:   { type: text }                     # markdown; empty = dropdown/label
      # Page-header extras (all optional, render only when set):
      description: { type: text }                # subtext shown under the H1
      author:      { type: string }              # byline shown in the header meta row
      badges:      { type: string }              # comma-separated pills (e.g. "New, Beta")
      order:  { type: integer, default: 0 }
      parent: { type: relation, target: pages }  # self-reference → the nav tree
      site:   { type: relation, target: sites }

  # Reader feedback on a page (the "How is this guide?" widget). Submitted by the
  # public through the rate-limited POST /__feedback route (which uses the privileged
  # store), so create here is admin-only — the raw API isn't a spam vector. Editors
  # read/hide/delete; `hidden` soft-hides without deleting.
  feedback:
    access:
      read:   [admin, editor]
      create: [admin]
      update: [admin, editor]
      delete: [admin, editor]
    fields:
      page:    { type: relation, target: pages, required: true }
      rating:  { type: enum, values: [good, bad], required: true }
      comment: { type: text }
      email:   { type: string }
      hidden:  { type: boolean, default: false }
